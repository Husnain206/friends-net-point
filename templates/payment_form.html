{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Receive Payment</h1><div class="muted">Payment record aur receipt details save karein.</div></div><a class="btn secondary" href="{{ url_for('payments') }}">Back</a></div><section class="panel"><form method="post"><div class="grid"><div class="field"><label>Customer *</label><select name="customer_id" id="customer" required><option value="">-- Select customer --</option>{% for c in customers %}<option value="{{ c.id }}" {% if selected_customer==c.id %}selected{% endif %}>{{ c.customer_code or ('#' ~ c.id) }} — {{ c.name }}</option>{% endfor %}</select></div><div class="field"><label>Bill (optional)</label><select name="bill_id"><option value="">-- Unlinked payment --</option>{% for b in bills %}<option value="{{ b.id }}">#{{ b.id }} {{ b.name }} · {{ b.bill_month }} · {{ b.total_due|money }}</option>{% endfor %}</select><div class="muted">Bill select karne par paid/unpaid status update hoga.</div></div><div class="field"><label>Amount (Rs.) *</label><input type="number" name="amount" min="0.01" step="0.01" required></div><div class="field"><label>Payment Date</label><input type="date" name="payment_date" value="{{ '' }}" placeholder="YYYY-MM-DD"></div><div class="field"><label>Payment Method</label><select name="method"><option>Cash</option><option>Bank Transfer</option><option>JazzCash</option><option>EasyPaisa</option><option>Other</option></select></div><div class="field"><label>Reference / Transaction ID</label><input name="reference"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn green">Save Payment</button></form></section>{% endblock %}
