{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Settings & Security</h1><div class="muted">Apna login password update karein.</div></div></div><section class="panel"><h2>Change Password</h2><form method="post"><div class="field"><label>Current Password</label><input type="password" name="current_password" required autocomplete="current-password"></div><div class="field"><label>New Password (minimum 10 characters)</label><input type="password" name="new_password" required minlength="10" autocomplete="new-password"></div><div class="field"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></div><button class="btn">Update Password</button></form></section><div class="notice">Public hosting par deploy karne se pehle secret key change karein, HTTPS enable karein, database backups set karein aur default password badlein.</div>{% endblock %}
