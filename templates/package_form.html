{% extends "base.html" %}{% block content %}<div class="pagehead"><h1>{{ 'Edit Package' if package else 'Add Package' }}</h1><a class="btn secondary" href="{{ url_for('packages') }}">Back</a></div><section class="panel"><form method="post"><div class="field"><label>Package Name *</label><input name="name" required value="{{ package.name if package else '' }}" placeholder="e.g. Home 20 Mbps"></div><div class="field"><label>Speed</label><input name="speed" value="{{ package.speed if package else '' }}" placeholder="20 Mbps"></div><div class="field"><label>Monthly Fee (Rs.) *</label><input type="number" name="monthly_fee" min="0" step="0.01" required value="{{ package.monthly_fee if package else '' }}"></div><div class="field"><label><input type="checkbox" name="active" style="width:auto" {% if not package or package.active %}checked{% endif %}> Active</label></div><button class="btn">Save Package</button></form></section>{% endblock %}
